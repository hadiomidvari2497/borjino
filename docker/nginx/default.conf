# Borjino - Nginx Site Configuration
server {
    listen 8080;
    listen [::]:8080;
    server_name borjino.local;
    root /var/www/html/public;
    index index.php index.html;

    # Security
    server_tokens off;

    # Root directory
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP Processing
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
    }

    # Static Assets Caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Security - Deny access to sensitive files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:env|log|sql|md|gitignore|gitattributes)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # API and AJAX endpoints
    location ~ ^/(api|ajax)/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Gzip for API responses
    gzip on;
    gzip_types application/json application/javascript text/css text/xml;
}