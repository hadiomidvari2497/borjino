name: Borjino CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './docs/*' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          for path in index.php login.php logout.php config.php database.sql includes/auth.php includes/functions.php; do
            test -f "$path"
          done

      - name: Validate SQL source
        shell: bash
        run: |
          set -euo pipefail
          test -s database.sql
          grep -q "CREATE TABLE.*users" database.sql
          grep -q "CREATE TABLE.*buildings" database.sql
          grep -q "CREATE TABLE.*units" database.sql

      - name: Build application artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a --exclude='docs/' --exclude='.git/' --exclude='.github/' --exclude='dist/' ./ dist/
          tar -czf "borjino-$GITHUB_SHA.tar.gz" -C dist .
          (cd dist && zip -qr "../borjino-$GITHUB_SHA.zip" .)
          rm -rf dist

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: borjino-application
          path: |
            borjino-*.tar.gz
            borjino-*.zip
          if-no-files-found: error
          retention-days: 14
