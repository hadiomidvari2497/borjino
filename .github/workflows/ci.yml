name: Borjino CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*')
          test -n "$files"
          while IFS= read -r file; do
            php -l "$file"
          done <<< "$files"

      - name: Bootstrap check
        run: php -r "require 'bootstrap/autoload.php'; echo 'Autoloader OK'.PHP_EOL;"
