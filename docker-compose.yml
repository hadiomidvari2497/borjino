version: '3.8'

services:
  # MySQL 8.4 Database
  mysql:
    image: mysql:8.4
    container_name: borjino-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: borjino
      MYSQL_USER: borjino
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-borjino_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      TZ: Asia/Tehran
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - borjino-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PHP-FPM Application (Development)
  app-dev:
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    container_name: borjino-app-dev
    restart: unless-stopped
    environment:
      APP_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: borjino
      DB_USERNAME: borjino
      DB_PASSWORD: ${MYSQL_PASSWORD:-borjino_secret}
      PHP_IDE_CONFIG: serverName=borjino
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
    networks:
      - borjino-network
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9000:9000"

  # Nginx + PHP-FPM (Production)
  app-prod:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    container_name: borjino-app-prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: borjino
      DB_USERNAME: borjino
      DB_PASSWORD: ${MYSQL_PASSWORD:-borjino_secret}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - borjino-network
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  # Database Migration Runner (raw PHP)
  migrate:
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    container_name: borjino-migrate
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: borjino
      DB_USERNAME: borjino
      DB_PASSWORD: ${MYSQL_PASSWORD:-borjino_secret}
    volumes:
      - .:/var/www/html
    networks:
      - borjino-network
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["php", "database/migrations/migrate.php"]
    profiles:
      - tools

  # PHPMyAdmin (Development only)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: borjino-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: borjino
      PMA_PASSWORD: ${MYSQL_PASSWORD:-borjino_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    networks:
      - borjino-network
    depends_on:
      - mysql
    ports:
      - "8081:80"
    profiles:
      - tools

volumes:
  mysql_data:
    driver: local

networks:
  borjino-network:
    driver: bridge